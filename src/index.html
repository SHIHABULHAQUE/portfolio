  <!-- Calligraphic Preloader -->
  <style>
    #app-preloader {
      position: fixed;
      inset: 0;
      background: #f4efe6;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.9s;
    }

    #app-preloader svg {
      width: min(70vw, 340px);
      height: auto;
      overflow: visible;
    }

    #app-preloader text {
      font-family: 'Great Vibes', cursive;
      font-size: 100px;
      fill: #1c2a21;
      fill-opacity: 0;
      stroke: #1c2a21;
      stroke-width: 1.2;
      stroke-dasharray: 1400;
      stroke-dashoffset: 1400;
      animation: pre-ink 2.2s cubic-bezier(0.65, 0, 0.35, 1) forwards, pre-fill 0.9s 1.5s ease forwards;
    }

    #app-preloader .pre-line {
      width: 0;
      height: 1px;
      background: #b89a74;
      animation: pre-line 1.4s 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes pre-ink { to { stroke-dashoffset: 0; } }
    @keyframes pre-fill { to { fill-opacity: 1; } }
    @keyframes pre-line { to { width: 140px; } }

    #app-preloader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #app-preloader text { animation: none; fill-opacity: 1; stroke-dashoffset: 0; }
      #app-preloader .pre-line { animation: none; width: 140px; }
    }
  </style>

<body>

  <!-- Calligraphic preloader: writes the signature while the app boots -->
  <div id="app-preloader">
    <svg viewBox="-10 -95 330 130" aria-label="Shihab" role="img">
      <text x="0" y="0">Shihab</text>
    </svg>
    <div class="pre-line"></div>
  </div>

  <app-root></app-root>

  <script>
    // Fade out preloader once the page has loaded and the signature has been written
    window.addEventListener('load', function () {
      const preloader = document.getElementById('app-preloader');
      setTimeout(function () {
        if (preloader) {
          preloader.classList.add('loaded');
        }
      }, 1400);
    });
  </script>

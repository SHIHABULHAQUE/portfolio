<section class="section" id="projects">
  <app-section-heading index="04" eyebrow="Selected work" title="Projects" script="stories" />

  <ol class="list">
    @for (project of projects; track project.title; let i = $index) {
      <li class="project" [class.open]="expandedIndex() === i" appReveal>
        <button class="row" (click)="toggle(i)" [attr.aria-expanded]="expandedIndex() === i" [attr.aria-controls]="'case-' + i">
          <span class="num">{{ (i + 1 < 10 ? '0' : '') + (i + 1) }}</span>
          <span class="title">{{ project.title }}</span>
          <span class="tags">
            @for (tech of project.technologies; track tech) {
              <span>{{ tech }}</span>
            }
          </span>
          <span class="toggle" aria-hidden="true"></span>
        </button>

        <div class="case" [id]="'case-' + i">
          <div class="case-inner">
            <p class="desc">{{ project.description }}</p>

            <dl class="facts">
              <div>
                <dt>The challenge</dt>
                <dd>{{ project.challenge }}</dd>
              </div>
              <div>
                <dt>The approach</dt>
                <dd>{{ project.solution }}</dd>
              </div>
              <div>
                <dt>Architecture</dt>
                <dd>{{ project.architecture }}</dd>
              </div>
              <div class="impact">
                <dt>Impact</dt>
                <dd>{{ project.impact }}</dd>
              </div>
            </dl>
          </div>
        </div>
      </li>
    }
  </ol>
</section>

<section class="section" id="experience">
  <app-section-heading index="01" eyebrow="Where I've worked" title="Experience" script="journey" />

  <ol class="timeline">
    @for (job of experience; track job.company; let i = $index) {
      <li class="job" appReveal>
        <div class="job-when">
          <span class="period">{{ job.period }}</span>
          <span class="place">{{ job.location }}</span>
        </div>

        <span class="node" aria-hidden="true"></span>

        <div class="job-body">
          <h3 class="role">{{ job.role }}</h3>
          <p class="company">{{ job.company }}</p>
          <ul class="duties">
            @for (desc of job.description; track desc) {
              <li>{{ desc }}</li>
            }
          </ul>
        </div>
      </li>
    }
  </ol>
</section>

<section class="section" id="experience">
  <div class="container">
    <app-section-heading index="02" label="Experience" title="Six years, *four teams,* one direction." />

    <ol class="timeline">
      <li class="rail" aria-hidden="true"><span class="fill"></span></li>

      @for (job of jobs; track job.company) {
        <li class="stop" appReveal>
          <span class="node" [class.live]="job.current" aria-hidden="true"></span>

          <div class="when">
            <span class="mono">{{ job.from }} — {{ job.to }}</span>
            <span class="mute">{{ job.location }}</span>
          </div>

          <article class="card" appSpotlight>
            <header>
              <h3>{{ job.role }}</h3>
              <p class="company grad">{{ job.company }}</p>
            </header>
            <ul>
              @for (point of job.description; track point) {
                <li>{{ point }}</li>
              }
            </ul>
          </article>
        </li>
      }
    </ol>
  </div>
</section>
